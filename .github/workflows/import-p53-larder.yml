name: import-p53-larder
on:
  push:
    paths:
      - '.github/workflows/import-p53-larder.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 53 LARDER Ns slice
        run: |
          set -euo pipefail
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -fsSL -o /tmp/p53.tar.gz "https://h.uguu.se/hHncwkWa.tar.gz"
          tar -tzf /tmp/p53.tar.gz
          tar -xzf /tmp/p53.tar.gz -C .
          git add README.md Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs
          if git diff --cached --quiet; then
            echo "no slice changes"
          else
            git commit -m "Unity slice: LARDER Ns food clock sits under BAR on the Hub."
            git push
          fi
          git pull --rebase origin main
          rm -f .github/workflows/import-p53-larder.yml
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "workflow already gone"
          else
            git commit -m "Drop Pass 53 import workflow."
            git push
          fi

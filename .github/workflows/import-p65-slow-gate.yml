name: import-p65-slow-gate
on:
  push:
    paths: ['.github/workflows/import-p65-slow-gate.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import SLOW GATE slice
        run: |
          set -euo pipefail
          curl -fsSL "https://d.uguu.se/xbxWiaKU.tar.gz" | tar -xzf - -C .
          git add \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unity slice: SLOW GATE -- Barrier plant drops a gate, not a cut beep."
          git push
          git pull --rebase origin main
          rm .github/workflows/import-p65-slow-gate.yml
          git add .github/workflows/import-p65-slow-gate.yml
          git commit -m "Drop Pass 65 import workflow"
          git push

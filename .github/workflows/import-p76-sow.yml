name: import-p76-sow
on:
  push:
    paths: ['.github/workflows/import-p76-sow.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 76 SOW
        run: |
          set -euo pipefail
          curl -fsSL "https://n.uguu.se/UerEFUcV.tgz" | tar -xzf - -C .
          git add \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unity slice: SOW -- extra Farm plants like Mine/Power."
          git push
          git pull --rebase origin main
          git rm .github/workflows/import-p76-sow.yml
          git commit -m "Drop Pass 76 import workflow"
          git push

name: import-p63-dusk-close
on:
  push:
    paths: ['.github/workflows/import-p63-dusk-close.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import DUSK CLOSE slice
        run: |
          set -euo pipefail
          curl -fsSL "https://n.uguu.se/HXePqBGR.tar.gz" | tar -xzf - -C .
          git add \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs \
            README.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unity slice: DUSK CLOSE -- last raids pull the camera in."
          git push
          git pull --rebase origin main
          rm .github/workflows/import-p63-dusk-close.yml
          git add .github/workflows/import-p63-dusk-close.yml
          git commit -m "Drop Pass 63 import workflow"
          git push

name: import-p80-free
on:
  push:
    paths: ['.github/workflows/import-p80-free.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 80 FREE
        run: |
          set -euo pipefail
          curl -fsSL "https://h.uguu.se/ReFJHZZs.tar.gz" | tar -xzf - -C .
          git add \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unity slice: FREE -- clicking the armed Route pad again frees the stake."
          git push
          git pull --rebase origin main
          git rm .github/workflows/import-p80-free.yml
          git commit -m "Drop Pass 80 import workflow"
          git push

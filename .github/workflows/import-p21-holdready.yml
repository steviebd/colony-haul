name: import-p21-holdready
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-p21-holdready.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 21 files
        env:
          TARBALL: https://n.uguu.se/DuiqjBWv.tgz
        run: |
          set -euo pipefail
          curl -fsSL "$TARBALL" -o /tmp/p21.tgz
          tar xzf /tmp/p21.tgz
          git config user.name "cursoragent"
          git config user.email "cursoragent@cursor.com"
          git add \
            Assets/_ColonyHaul/Scripts/Core/GameSim.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          if git diff --cached --quiet; then
            echo "no file changes"
          else
            git commit -m "Unity slice: HOLD READY names H for GUNS or CREW on wave 4."
          fi
          rm -f .github/workflows/import-p21-holdready.yml
          git add .github/workflows/import-p21-holdready.yml
          if git diff --cached --quiet; then
            echo "workflow already gone"
          else
            git commit -m "Drop Pass 21 import workflow."
          fi
          git push

name: import-p10
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-p10.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 10 Unity bytes
        run: |
          set -euo pipefail
          curl -fsSL -o p10.tgz "https://d.uguu.se/zRpRmQJu.tgz"
          tar xzf p10.tgz
          rm p10.tgz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/_ColonyHaul/Scripts/Core/GameSim.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          git commit -m "Unity slice: CORE BOUND telegraph on the last hop to Hub." || true
          rm -f .github/workflows/import-p10.yml
          git add -A
          git commit -m "chore: drop one-shot import Pass 10" || true
          git push

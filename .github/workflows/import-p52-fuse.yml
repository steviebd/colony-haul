name: import-p52-fuse
on:
  push:
    paths:
      - '.github/workflows/import-p52-fuse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 52 FUSE Ns slice
        run: |
          set -euo pipefail
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -fsSL -o /tmp/p52.tar.gz "https://h.uguu.se/KGMhDLBG.tar.gz"
          tar -tzf /tmp/p52.tar.gz
          tar -xzf /tmp/p52.tar.gz -C .
          git add README.md Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs
          if git diff --cached --quiet; then
            echo "no slice changes"
          else
            git commit -m "Unity slice: FUSE Ns fire clock sits under OPEN on the Hub."
            git push
          fi
          git pull --rebase origin main
          rm -f .github/workflows/import-p52-fuse.yml
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "workflow already gone"
          else
            git commit -m "Drop Pass 52 import workflow."
            git push
          fi

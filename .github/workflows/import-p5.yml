name: import-p5
on:
  push:
    paths:
      - '.github/workflows/import-p5.yml'
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 5 Hold order
        run: |
          set -euo pipefail
          curl -fsSL "https://h.uguu.se/AwGOLiez.tgz" -o /tmp/p.tgz
          tar -xzf /tmp/p.tgz -C "$GITHUB_WORKSPACE"
          rm -f .github/workflows/import-p5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unity slice: late-match Hold order — GUNS vs CREW."
          git push

name: import-p82-putdown
on:
  push:
    paths: ['.github/workflows/import-p82-putdown.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 82 PUT DOWN
        run: |
          set -euo pipefail
          curl -fsSL "https://d.uguu.se/fKmTnkpt.tar.gz" | tar -xzf - -C .
          git add \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs \
            README.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unity slice: PUT DOWN -- right-click puts the tool down."
          git push
          git pull --rebase origin main
          git rm .github/workflows/import-p82-putdown.yml
          git commit -m "Drop Pass 82 import workflow"
          git push

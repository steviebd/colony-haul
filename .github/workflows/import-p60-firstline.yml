name: import-p60-firstline
on:
  push:
    paths:
      - '.github/workflows/import-p60-firstline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 60 FIRST LINE slice
        run: |
          set -euo pipefail
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -fsSL -o /tmp/p60.tar.gz "https://d.uguu.se/lVdpuADr.tar.gz"
          tar -tzf /tmp/p60.tar.gz
          tar -xzf /tmp/p60.tar.gz -C .
          git add README.md Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs
          if git diff --cached --quiet; then
            echo "no slice changes"
          else
            git commit -m "Unity slice: FIRST LINE -- Farm bloom, rail snap, first haul."
            git push
          fi
          git pull --rebase origin main
          rm -f .github/workflows/import-p60-firstline.yml
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "workflow already gone"
          else
            git commit -m "Drop Pass 60 import workflow."
            git push
          fi

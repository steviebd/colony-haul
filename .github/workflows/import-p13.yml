name: import-p13
on:
  push:
    paths:
      - '.github/workflows/import-p13.yml'
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and unpack
        run: |
          curl -fsSL -o /tmp/p13.tgz "https://h.uguu.se/OhnVZsCL.tgz"
          tar -tzf /tmp/p13.tgz
          tar -xzf /tmp/p13.tgz
      - name: Commit import and drop workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/_ColonyHaul/Scripts/Core/GameSim.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          git commit -m "Unity slice: PAD OFFLINE ghost-rail when a producer has no home." || true
          rm -f .github/workflows/import-p13.yml
          git add .github/workflows/import-p13.yml
          git commit -m "chore: drop one-shot import Pass 13" || true
          git push

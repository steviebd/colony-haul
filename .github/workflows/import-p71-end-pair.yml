name: import-p71-end-pair
on:
  push:
    paths: ['.github/workflows/import-p71-end-pair.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import END PAIR slice
        run: |
          set -euo pipefail
          curl -fsSL "https://n.uguu.se/YMXFcSCB.tar.gz" | tar -xzf - -C .
          git add \
            Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs \
            README.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unity slice: END PAIR -- win/lose card offers Run it back or Watch a run."
          git push
          git pull --rebase origin main
          rm .github/workflows/import-p71-end-pair.yml
          git add .github/workflows/import-p71-end-pair.yml
          git commit -m "Drop Pass 71 import workflow"
          git push

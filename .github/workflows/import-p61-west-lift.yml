name: import-p61-west-lift
on:
  push:
    paths: ['.github/workflows/import-p61-west-lift.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import WEST LIFT slice
        run: |
          set -euo pipefail
          curl -fsSL "https://h.uguu.se/TbdRLTTk.tar.gz" | tar -xzf - -C .
          git add \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs \
            README.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unity slice: WEST LIFT -- Hub raise then Splash west unlock."
          git push
          git pull --rebase origin main
          rm .github/workflows/import-p61-west-lift.yml
          git add .github/workflows/import-p61-west-lift.yml
          git commit -m "Drop Pass 61 import workflow"
          git push

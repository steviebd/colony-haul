name: import-pass4
on:
  push:
    paths:
      - '.github/workflows/import-pass4-origin-files.yml'
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Origin pass-4 Unity deltas
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/delta.tgz https://n.uguu.se/kJTlLvyy.tgz
          echo "e1f6eac96e033a8fa50c1b5630713d15b022f1ec7475413b2ae954b2e0797700  /tmp/delta.tgz" | sha256sum -c
          tar -xzf /tmp/delta.tgz -C .
          rm -f .github/workflows/import-pass4-origin-files.yml
          git config user.name "cursor-agent"
          git config user.email "cursoragent@cursor.com"
          git add README.md Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs Assets/_ColonyHaul/Scripts/Core/GameSim.cs playable/src/sim/game.ts
          git add -u .github/workflows/import-pass4-origin-files.yml
          git status
          git commit -m "Unity slice: late-watch CORE THIN, crew stretch, and hold."
          git push

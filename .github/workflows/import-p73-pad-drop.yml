name: import-p73-pad-drop
on:
  push:
    paths: ['.github/workflows/import-p73-pad-drop.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import PAD DROP slice
        run: |
          set -euo pipefail
          curl -fsSL "https://h.uguu.se/zLpYSbun.tar.gz" | tar -xzf - -C .
          git add \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unity slice: PAD DROP -- Mine/Power plant on the pad."
          git push
          git pull --rebase origin main
          rm .github/workflows/import-p73-pad-drop.yml
          git add .github/workflows/import-p73-pad-drop.yml
          git commit -m "Drop Pass 73 import workflow"
          git push

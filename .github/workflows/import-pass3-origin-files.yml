name: import-pass3
on:
  push:
    paths:
      - '.github/workflows/import-pass3-origin-files.yml'
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Origin pass-3 deltas
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/delta.tgz https://h.uguu.se/NJdvbxAH.tgz
          echo "d17fb157c4d63503499c75cd7a7c904687fec9626a9aa59354667139b36cabc3  /tmp/delta.tgz" | sha256sum -c
          tar -xzf /tmp/delta.tgz -C .
          rm -f .github/workflows/import-pass3-origin-files.yml
          git config user.name "cursor-agent"
          git config user.email "cursoragent@cursor.com"
          git add README.md Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs Assets/_ColonyHaul/Scripts/Core/GameSim.cs Assets/_ColonyHaul/Scripts/Core/Types.cs
          git add -u .github/workflows/import-pass3-origin-files.yml
          git status
          git commit -m "Unity slice: mid-watch coach, lane threat, and haul trails."
          git push

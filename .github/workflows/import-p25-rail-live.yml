name: import-p25-rail-live
on:
  push:
    paths:
      - '.github/workflows/import-p25-rail-live.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 25 RAIL LIVE
        env:
          URL: https://h.uguu.se/xMySTzJZ.tgz
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/p25.tgz "$URL"
          tar -xzf /tmp/p25.tgz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md \
            Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            Assets/_ColonyHaul/Scripts/Core/GameSim.cs
          git diff --cached --quiet || git commit -m "Unity slice: RAIL LIVE names what rolls after a splice."
          git push
          rm -f .github/workflows/import-p25-rail-live.yml
          git add -A .github/workflows || true
          if git status --porcelain | grep -q .github; then
            git commit -m "Drop Pass 25 import workflow."
            git push
          fi

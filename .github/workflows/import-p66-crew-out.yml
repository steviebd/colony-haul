name: import-p66-crew-out
on:
  push:
    paths: ['.github/workflows/import-p66-crew-out.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import CREW OUT slice
        run: |
          set -euo pipefail
          curl -fsSL "https://h.uguu.se/QnGyAlEf.tar.gz" | tar -xzf - -C .
          git add \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unity slice: CREW OUT -- Hub L2 extra cart rolls out of the yard."
          git push
          git pull --rebase origin main
          rm .github/workflows/import-p66-crew-out.yml
          git add .github/workflows/import-p66-crew-out.yml
          git commit -m "Drop Pass 66 import workflow"
          git push

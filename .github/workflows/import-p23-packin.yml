name: import-p23-packin
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-p23-packin.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 23 files
        env:
          TARBALL: https://h.uguu.se/AquVkXKT.tgz
        run: |
          set -euo pipefail
          curl -fsSL "$TARBALL" -o /tmp/p23.tgz
          tar xzf /tmp/p23.tgz
          git config user.name "cursoragent"
          git config user.email "cursoragent@cursor.com"
          git add \
            Assets/_ColonyHaul/Scripts/Core/GameSim.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          if git diff --cached --quiet; then
            echo "no file changes"
          else
            git commit -m "Unity slice: PACK IN names the last 8s before a wave."
          fi
          rm -f .github/workflows/import-p23-packin.yml
          git add .github/workflows/import-p23-packin.yml
          if git diff --cached --quiet; then
            echo "workflow already gone"
          else
            git commit -m "Drop Pass 23 import workflow."
          fi
          git push

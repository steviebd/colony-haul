name: import-p59-dryback
on:
  push:
    paths:
      - '.github/workflows/import-p59-dryback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 59 DRY BACK slice
        run: |
          set -euo pipefail
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -fsSL -o /tmp/p59.tar.gz "https://h.uguu.se/cOUJxmDL.tar.gz"
          tar -tzf /tmp/p59.tar.gz
          tar -xzf /tmp/p59.tar.gz -C .
          git add README.md Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs
          if git diff --cached --quiet; then
            echo "no slice changes"
          else
            git commit -m "Unity slice: DRY\u2192BACK \u2014 empty guns die, then bloom FIRE."
            git push
          fi
          git pull --rebase origin main
          rm -f .github/workflows/import-p59-dryback.yml
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "workflow already gone"
          else
            git commit -m "Drop Pass 59 import workflow."
            git push
          fi

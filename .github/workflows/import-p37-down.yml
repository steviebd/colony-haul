name: import-p37-down
on:
  push:
    paths:
      - '.github/workflows/import-p37-down.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 37 DOWN n slice
        run: |
          set -euo pipefail
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -fsSL -o /tmp/p37.tar.gz "https://n.uguu.se/goWTsoeU.tgz"
          tar -tzf /tmp/p37.tar.gz
          tar -xzf /tmp/p37.tar.gz -C .
          git add README.md Assets/_ColonyHaul/Scripts/Core/GameSim.cs Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs
          if git diff --cached --quiet; then
            echo "no slice changes"
          else
            git commit -m "Unity slice: DOWN n this-wave kills sit above RAID."
            git push
          fi
          git pull --rebase origin main
          rm -f .github/workflows/import-p37-down.yml
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "workflow already gone"
          else
            git commit -m "Drop Pass 37 import workflow."
            git push
          fi

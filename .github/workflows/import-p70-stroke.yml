name: import-p70-stroke
on:
  push:
    paths: ['.github/workflows/import-p70-stroke.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import STROKE slice
        run: |
          set -euo pipefail
          curl -fsSL "https://d.uguu.se/xgdhTiwD.tar.gz" | tar -xzf - -C .
          git add \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            README.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unity slice: STROKE -- teach lines fatten vs gun bolts."
          git push
          git pull --rebase origin main
          rm .github/workflows/import-p70-stroke.yml
          git add .github/workflows/import-p70-stroke.yml
          git commit -m "Drop Pass 70 import workflow"
          git push

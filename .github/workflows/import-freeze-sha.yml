name: import-freeze-sha
on:
  push:
    paths: ['.github/workflows/import-freeze-sha.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import freeze SHA stamp
        run: |
          set -euo pipefail
          curl -fsSL "https://h.uguu.se/DvwTZohd.tar.gz" | tar -xzf - -C .
          git add artifacts/FM-GAME-002.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stamp Origin and GitHub freeze SHAs for Firstmate hard-sign."
          git push
          git pull --rebase origin main
          git rm .github/workflows/import-freeze-sha.yml
          git commit -m "Drop freeze SHA import workflow"
          git push

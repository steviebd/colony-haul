name: import-p44-roll
on:
  push:
    paths:
      - '.github/workflows/import-p44-roll.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 44 ROLL n slice
        run: |
          set -euo pipefail
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -fsSL -o /tmp/p44.tar.gz "https://n.uguu.se/hmHzEisD.tar.gz"
          tar -tzf /tmp/p44.tar.gz
          tar -xzf /tmp/p44.tar.gz -C .
          git add README.md Assets/_ColonyHaul/Scripts/Core/GameSim.cs Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs
          if git diff --cached --quiet; then
            echo "no slice changes"
          else
            git commit -m "Unity slice: ROLL n moving haulers sit between STUCK and SLOW."
            git push
          fi
          git pull --rebase origin main
          rm -f .github/workflows/import-p44-roll.yml
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "workflow already gone"
          else
            git commit -m "Drop Pass 44 import workflow."
            git push
          fi

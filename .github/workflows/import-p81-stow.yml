name: import-p81-stow
on:
  push:
    paths: ['.github/workflows/import-p81-stow.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 81 STOW
        run: |
          set -euo pipefail
          curl -fsSL "https://d.uguu.se/UZzmxaEs.tar.gz" | tar -xzf - -C .
          git add \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unity slice: STOW -- pressing the same tool key again stows it."
          git push
          git pull --rebase origin main
          git rm .github/workflows/import-p81-stow.yml
          git commit -m "Drop Pass 81 import workflow"
          git push

name: import-p9
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-p9.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 9 Unity bytes
        run: |
          set -euo pipefail
          curl -fsSL -o p9.tgz "https://h.uguu.se/BsfQCMiX.tgz"
          tar xzf p9.tgz
          rm p9.tgz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/_ColonyHaul/Scripts/Core/GameSim.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          git commit -m "Unity slice: GUNS DRY telegraph when towers click empty." || true
          rm -f .github/workflows/import-p9.yml
          git add -A
          git commit -m "chore: drop one-shot import Pass 9" || true
          git push

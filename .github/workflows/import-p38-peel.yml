name: import-p38-peel
on:
  push:
    paths:
      - '.github/workflows/import-p38-peel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 38 HOLD PEEL kernel
        run: |
          set -euo pipefail
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -fsSL -o /tmp/p38.tar.gz "https://d.uguu.se/UsRzVxNw.tgz"
          tar -tzf /tmp/p38.tar.gz
          tar -xzf /tmp/p38.tar.gz -C .
          git add README.md \
            Assets/_ColonyHaul/Scripts/Core/GameSim.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs \
            playable/src/sim/game.ts \
            playable/src/sim/playtest.ts \
            playable/src/main.ts
          if git diff --cached --quiet; then
            echo "no slice changes"
          else
            git commit -m "Hold PEEL: GUNS/CREW stash unmatched cargo and replan loaded haulers."
            git push
          fi
          git pull --rebase origin main
          rm -f .github/workflows/import-p38-peel.yml
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "workflow already gone"
          else
            git commit -m "Drop Pass 38 import workflow."
            git push
          fi

name: import-p58-yank
on:
  push:
    paths:
      - '.github/workflows/import-p58-yank.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 58 HOLD YANK slice
        run: |
          set -euo pipefail
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -fsSL -o /tmp/p58.tar.gz "https://n.uguu.se/RXHnxnFQ.tar.gz"
          tar -tzf /tmp/p58.tar.gz
          tar -xzf /tmp/p58.tar.gz -C .
          git add README.md Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs
          if git diff --cached --quiet; then
            echo "no slice changes"
          else
            git commit -m "Unity slice: HOLD YANK — H peels carts toward the pad."
            git push
          fi
          git pull --rebase origin main
          rm -f .github/workflows/import-p58-yank.yml
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "workflow already gone"
          else
            git commit -m "Drop Pass 58 import workflow."
            git push
          fi

name: import-p72-line-out
on:
  push:
    paths: ['.github/workflows/import-p72-line-out.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import LINE OUT slice
        run: |
          set -euo pipefail
          curl -fsSL "https://n.uguu.se/CDNZTVSd.tar.gz" | tar -xzf - -C .
          git add \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unity slice: LINE OUT -- every new mag-rail strokes like the first."
          git push
          git pull --rebase origin main
          rm .github/workflows/import-p72-line-out.yml
          git add .github/workflows/import-p72-line-out.yml
          git commit -m "Drop Pass 72 import workflow"
          git push

name: import-p74-gun-set
on:
  push:
    paths: ['.github/workflows/import-p74-gun-set.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import GUN SET slice
        run: |
          set -euo pipefail
          curl -fsSL "https://d.uguu.se/vDgaZYEx.tar.gz" | tar -xzf - -C .
          git add \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unity slice: GUN SET -- Kinetic/Splash click sets the barrel."
          git push
          git pull --rebase origin main
          rm .github/workflows/import-p74-gun-set.yml
          git add .github/workflows/import-p74-gun-set.yml
          git commit -m "Drop Pass 74 import workflow"
          git push

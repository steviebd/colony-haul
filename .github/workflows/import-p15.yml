name: import-p15
on:
  push:
    paths:
      - '.github/workflows/import-p15.yml'
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and unpack
        run: |
          curl -fsSL -o /tmp/p15.tgz "https://d.uguu.se/HTJBYjrd.tgz"
          tar -tzf /tmp/p15.tgz
          tar -xzf /tmp/p15.tgz
      - name: Commit import and drop workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/_ColonyHaul/Scripts/Core/GameSim.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          git commit -m "Unity slice: GUNS LOW telegraphs Power haul before brownout." || true
          rm -f .github/workflows/import-p15.yml
          git add .github/workflows/import-p15.yml
          git commit -m "chore: drop one-shot import Pass 15" || true
          git push

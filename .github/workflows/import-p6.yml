name: import-p6
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-p6.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 6 Unity bytes
        run: |
          set -euo pipefail
          curl -fsSL -o p6.tgz "https://d.uguu.se/eVRktDQJ.tgz"
          tar xzf p6.tgz
          rm p6.tgz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/_ColonyHaul/Scripts/Boot/MesaView.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            Assets/_ColonyHaul/Scripts/Core/GameSim.cs \
            README.md
          git commit -m "Unity slice: gun lock, BRACE inbound, and spawn forecast." || true
          rm -f .github/workflows/import-p6.yml
          git add -A
          git commit -m "chore: drop one-shot import Pass 6" || true
          git push

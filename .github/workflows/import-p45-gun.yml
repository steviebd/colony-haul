name: import-p45-gun
on:
  push:
    paths:
      - '.github/workflows/import-p45-gun.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 45 GUN n slice
        run: |
          set -euo pipefail
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -fsSL -o /tmp/p45.tar.gz "https://d.uguu.se/rOVggMHR.tar.gz"
          tar -tzf /tmp/p45.tar.gz
          tar -xzf /tmp/p45.tar.gz -C .
          git add README.md Assets/_ColonyHaul/Scripts/Core/GameSim.cs Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs
          if git diff --cached --quiet; then
            echo "no slice changes"
          else
            git commit -m "Unity slice: GUN n live towers sit beside STAFF."
            git push
          fi
          git pull --rebase origin main
          rm -f .github/workflows/import-p45-gun.yml
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "workflow already gone"
          else
            git commit -m "Drop Pass 45 import workflow."
            git push
          fi

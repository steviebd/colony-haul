name: import-p26-tape
on:
  push:
    paths:
      - '.github/workflows/import-p26-tape.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit tape
        run: |
          set -euo pipefail
          curl -fsSL -o drop.tgz https://n.uguu.se/jKewrung.tgz
          tar -xzf drop.tgz
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/FM-GAME-002.md
          if git diff --cached --quiet; then echo "no tape changes"; else git commit -m "Refresh Firstmate package for Pass 26 GUNS BACK SHAs."; fi
          rm -f .github/workflows/import-p26-tape.yml
          git add .github/workflows/import-p26-tape.yml
          if git diff --cached --quiet; then echo "no workflow change"; else git commit -m "Drop Pass 26 tape import workflow."; fi
          git push

name: import-p68-fresh-r
on:
  push:
    paths: ['.github/workflows/import-p68-fresh-r.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import FRESH R slice
        run: |
          set -euo pipefail
          curl -fsSL "https://d.uguu.se/YcBMbkfe.tar.gz" | tar -xzf - -C .
          git add \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unity slice: FRESH R -- restart clears leftover juice."
          git push
          git pull --rebase origin main
          rm .github/workflows/import-p68-fresh-r.yml
          git add .github/workflows/import-p68-fresh-r.yml
          git commit -m "Drop Pass 68 import workflow"
          git push

name: import-p36-pending
on:
  push:
    paths:
      - '.github/workflows/import-p36-pending.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 36 IN +n slice
        run: |
          set -euo pipefail
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -fsSL -o /tmp/p36.tar.gz "https://d.uguu.se/ZXrChLUD.tgz"
          tar -tzf /tmp/p36.tar.gz
          tar -xzf /tmp/p36.tar.gz -C .
          git add README.md Assets/_ColonyHaul/Scripts/Core/GameSim.cs Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs
          if git diff --cached --quiet; then
            echo "no slice changes"
          else
            git commit -m "Unity slice: IN +n pending raiders sit beside RAID."
            git push
          fi
          git pull --rebase origin main
          rm -f .github/workflows/import-p36-pending.yml
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "workflow already gone"
          else
            git commit -m "Drop Pass 36 import workflow."
            git push
          fi

name: import-p11
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-p11.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 11 Unity bytes
        run: |
          set -euo pipefail
          curl -fsSL -o p11.tgz "https://n.uguu.se/GiKBKGkk.tgz"
          tar xzf p11.tgz
          rm p11.tgz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/_ColonyHaul/Scripts/Core/GameSim.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceHud.cs \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          git commit -m "Unity slice: WAVE CLEAR telegraph in the gap between raids." || true
          rm -f .github/workflows/import-p11.yml
          git add -A
          git commit -m "chore: drop one-shot import Pass 11" || true
          git push

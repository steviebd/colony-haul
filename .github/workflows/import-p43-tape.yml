name: import-p43-tape
on:
  push:
    paths:
      - '.github/workflows/import-p43-tape.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Pass 43 tape
        run: |
          set -euo pipefail
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -fsSL -o /tmp/p43-tape.tar.gz "https://n.uguu.se/lwXcqQkT.tar.gz"
          tar -tzf /tmp/p43-tape.tar.gz
          tar -xzf /tmp/p43-tape.tar.gz -C .
          git add artifacts/FM-GAME-002.md
          if git diff --cached --quiet; then
            echo "no tape changes"
          else
            git commit -m "Refresh Firstmate package for Pass 43 SLOW n SHAs."
            git push
          fi
          git pull --rebase origin main
          rm -f .github/workflows/import-p43-tape.yml
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "workflow already gone"
          else
            git commit -m "Drop Pass 43 tape import workflow."
            git push
          fi

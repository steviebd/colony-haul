name: import-p64-splash-slam
on:
  push:
    paths: ['.github/workflows/import-p64-splash-slam.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import SPLASH SLAM slice
        run: |
          set -euo pipefail
          curl -fsSL "https://d.uguu.se/mnBonAyw.tar.gz" | tar -xzf - -C .
          git add \
            Assets/_ColonyHaul/Scripts/Boot/SliceJuice.cs \
            Assets/_ColonyHaul/Scripts/Boot/VerticalSliceBootstrap.cs \
            README.md
          git config user.name "colony-haul-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unity slice: SPLASH SLAM -- west Splash hits like an AOE, not a tick."
          git push
          git pull --rebase origin main
          rm .github/workflows/import-p64-splash-slam.yml
          git add .github/workflows/import-p64-splash-slam.yml
          git commit -m "Drop Pass 64 import workflow"
          git push
